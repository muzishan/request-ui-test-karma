_schema-version: "3.2"
ID: special-discount-request-ui
version: 1.2.0
modules:
- name: special-discount-request-ui-destination-content
  type: com.sap.application.content
  requires:
  - name: special-discount-request-destination-service
    parameters:
      content-target: true
  - name: special-discount-request-ui_html_repo_host
    parameters:
      service-key:
        name: special-discount-request-ui_html_repo_host-key
  - name: uaa_special-discount-request-ui
    parameters:
      service-key:
        name: uaa_special-discount-request-ui-key
  parameters:
    content:
      instance:
        destinations:
        - Name: special_discount_request_service_special_discount_request_ui_html_repo_host
          ServiceInstanceName: special-discount-request-ui-html5-app-host-service
          ServiceKeyName: special-discount-request-ui_html_repo_host-key
          sap.cloud.service: special-discount-request.service
        - Authentication: OAuth2UserTokenExchange
          Name: special_discount_request_service_uaa_special_discount_request_ui
          ServiceInstanceName: special-discount-request-ui-xsuaa-service
          ServiceKeyName: uaa_special-discount-request-ui-key
          sap.cloud.service: special-discount-request.service
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: special-discount-request-ui-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: special-discount-request-ui_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comkionsdruiproductmanagement.zip
      name: comkionsdruiproductmanagement
      target-path: resources/
    - artifacts:
      - comkionsdruimasterdata.zip
      name: comkionsdruimasterdata
      target-path: resources/
- name: comkionsdruiproductmanagement
  type: html5
  path: productmanagement
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comkionsdruimasterdata
  type: html5
  path: masterdata
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: special-discount-request-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: special-discount-request-destination-service
    service-plan: lite
- name: special-discount-request-ui_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: special-discount-request-ui-html5-app-host-service
    service-plan: app-host
- name: uaa_special-discount-request-ui
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: special-discount-request-ui-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
